name: Deploy to Beget

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload files to Beget
        uses: easingthemes/ssh-deploy@v5.1.1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.BEGET_HOST }}
          REMOTE_USER: ${{ secrets.BEGET_USER }}
          REMOTE_PORT: ${{ secrets.BEGET_PORT }}
          SOURCE: ./
          TARGET: ${{ secrets.BEGET_TARGET }}
          ARGS: -rlgoDzvc -i
          EXCLUDE: /.git/, /.github/, /.DS_Store, /Архив.zip
